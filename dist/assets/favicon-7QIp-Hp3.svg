<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    :root {
      --bg: #ffffff;
      --border: #dbe6df;
      --stroke-v: #6eb895;
      --point: #141c18;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141c18;
        --border: #2c3e35;
        --stroke-v: #6eb895;
        --point: #6eb895;
      }
    }
  </style>
  <!-- Fundo adaptativo com cantos arredondados elegantes -->
  <rect width="64" height="64" rx="16" fill="var(--bg)" stroke="var(--border)" stroke-width="2" />
  <!-- 'V' Geométrico Clean estilo Avant Garde -->
  <path d="M18 20L32 46L46 20" stroke="var(--stroke-v)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Ponto superior do nó de dados / código -->
  <circle cx="32" cy="22" r="3.5" fill="var(--point)" />
</svg>
