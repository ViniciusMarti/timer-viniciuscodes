<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>25:00 - Foco | timer.viniciuscodes.com.br</title>
  <meta name="description" content="Pomodoro timer minimalista e acessível focado em TEA Nível 1 e TDAH com Screen Wake Lock API nativa e alta precisão delta timestamp." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Cabeçalho Minimalista -->
  <header>
    <a href="https://viniciuscodes.com.br" class="brand" aria-label="viniciuscodes website principal">
      <img src="/favicon.svg" alt="Vinicius Codes" width="26" height="26" class="logo-icon" />
      <span>viniciuscodes</span>
      <span class="brand-badge">timer</span>
    </a>
    
    <div class="header-controls">
      <!-- Toggle Lofi Ambient -->
      <button id="lofi-toggle-btn" class="icon-btn" aria-label="Ligar som ambiente Lofi" title="Música Lofi de Foco [L]">
        <svg id="lofi-play-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span class="btn-text-badge">Lofi</span>
      </button>

      <!-- Toggle Som de Conclusão -->
      <button id="sound-toggle-btn" class="icon-btn" aria-label="Alternar som de conclusão" title="Alerta de conclusão [M]">
        <svg id="sound-on-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg id="sound-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>

      <!-- Toggle Tema -->
      <button id="theme-toggle-btn" class="icon-btn" aria-label="Alternar tema claro/escuro" title="Alternar tema">
        <svg id="theme-moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg id="theme-sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main>
    <!-- Seleção de Modos -->
    <nav class="mode-selector" role="tablist" aria-label="Modos do temporizador">
      <button role="tab" aria-selected="true" id="tab-focus" class="mode-btn active" data-mode="focus" data-minutes="25">Foco (25m)</button>
      <button role="tab" aria-selected="false" id="tab-short" class="mode-btn" data-mode="shortBreak" data-minutes="5">Pausa Curta (5m)</button>
      <button role="tab" aria-selected="false" id="tab-long" class="mode-btn" data-mode="longBreak" data-minutes="15">Pausa Longa (15m)</button>
    </nav>

    <!-- Visualização do Timer -->
    <div class="timer-container">
      <div id="timer-display" class="time-readout mono" aria-live="polite" aria-atomic="true">25:00</div>
      
      <!-- Barra de Progresso Suave e Não Invasiva -->
      <div class="progress-track" role="progressbar" id="progress-bar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <!-- Barra de Status (Screen Wake Lock e Ciclo) -->
    <div class="status-bar">
      <div class="status-pill" id="screen-status-pill" title="Status da Screen Wake Lock API">
        <span id="screen-status-dot" class="status-dot"></span>
        <span id="screen-status-label">Modo padrão</span>
      </div>
      <div class="status-pill">
        <span id="cycle-status-label">Ciclo em repouso</span>
      </div>
    </div>

    <!-- Botões de Ação Primária (tamanho confortável, sem alertas agressivos) -->
    <div class="controls-group">
      <button id="start-btn" class="btn-primary" aria-label="Iniciar ou pausar temporizador">Iniciar</button>
      <button id="reset-btn" class="btn-secondary" aria-label="Resetar temporizador">Resetar</button>
    </div>

    <!-- Painel de Ajuste Manual Direto -->
    <div class="custom-duration-panel">
      <span>Duração do modo ativo:</span>
      <div class="custom-duration-inputs">
        <input type="number" id="manual-min-input" class="duration-input" min="1" max="360" value="25" aria-label="Minutos para o modo selecionado" />
        <span class="mono">min</span>
      </div>
    </div>
  </main>

  <!-- Rodapé com Atalhos e Identidade -->
  <footer>
    <div class="hints">
      <span><span class="kbd-badge">Espaço</span> Iniciar/Pausar</span>
      <span><span class="kbd-badge">R</span> Resetar</span>
      <span><span class="kbd-badge">1-3</span> Modos</span>
      <span><span class="kbd-badge">L</span> Lofi</span>
      <span><span class="kbd-badge">M</span> Mudo</span>
    </div>
    <div>
      <span>timer.viniciuscodes.com.br</span>
    </div>
  </footer>

<script type="module" src="app.js"></script>
</body>
</html>
