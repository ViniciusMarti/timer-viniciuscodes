  <!-- Conteúdo Principal -->
  <main>
    <!-- Seletor de Telas (Pomodoro vs Timer Simples) -->
    <div class="view-switcher" role="tablist" aria-label="Tipo de Temporizador">
      <button role="tab" id="view-pomodoro-btn" class="view-btn active" aria-selected="true">🍅 Pomodoro</button>
      <button role="tab" id="view-timer-btn" class="view-btn" aria-selected="false">⏱️ Timer Simples</button>
    </div>

    <!-- TELA 1: Seleção de Modos Pomodoro (Ciclos de Foco e Pausas) -->
    <nav id="pomodoro-modes-nav" class="mode-selector" role="tablist" aria-label="Modos do Pomodoro">
      <button role="tab" aria-selected="true" id="tab-focus" class="mode-btn active" data-mode="focus" data-minutes="25">Foco (25m)</button>
      <button role="tab" aria-selected="false" id="tab-short" class="mode-btn" data-mode="shortBreak" data-minutes="5">Pausa Curta (5m)</button>
      <button role="tab" aria-selected="false" id="tab-long" class="mode-btn" data-mode="longBreak" data-minutes="15">Pausa Longa (15m)</button>
    </nav>

    <!-- TELA 2: Presets Rápidos do Timer Simples (Estilo cronômetro/timer direto) -->
    <nav id="simple-timer-modes-nav" class="mode-selector" style="display: none;" role="tablist" aria-label="Tempos Rápidos">
      <button role="tab" class="mode-btn" data-timer-min="1">1 min</button>
      <button role="tab" class="mode-btn active" data-timer-min="5">5 min</button>
      <button role="tab" class="mode-btn" data-timer-min="10">10 min</button>
      <button role="tab" class="mode-btn" data-timer-min="30">30 min</button>
      <button role="tab" class="mode-btn" data-timer-min="60">1h</button>
    </nav>

    <!-- Visualização do Timer -->
    <div class="timer-container">
      <div id="timer-display" class="time-readout mono" aria-live="polite" aria-atomic="true">25:00</div>
      
      <!-- Barra de Progresso Suave e Não Invasiva -->
      <div class="progress-track" role="progressbar" id="progress-bar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <!-- Barra de Status (Screen Wake Lock e Ciclo) -->
    <div class="status-bar">
      <div class="status-pill" id="screen-status-pill" title="Status da Screen Wake Lock API">
        <span id="screen-status-dot" class="status-dot"></span>
        <span id="screen-status-label">Modo padrão</span>
      </div>
      <div class="status-pill">
        <span id="cycle-status-label">Ciclo em repouso</span>
      </div>
    </div>

    <!-- Botões de Ação Primária (tamanho confortável, sem alertas agressivos) -->
    <div class="controls-group">
      <button id="start-btn" class="btn-primary" aria-label="Iniciar ou pausar temporizador">Iniciar</button>
      <button id="reset-btn" class="btn-secondary" aria-label="Resetar temporizador">Resetar</button>
    </div>

    <!-- Painel de Ajuste Manual Direto -->
    <div class="custom-duration-panel">
      <span id="manual-label">Minutos personalizados:</span>
      <div class="custom-duration-inputs">
        <input type="number" id="manual-min-input" class="duration-input" min="1" max="360" value="25" aria-label="Minutos personalizados" />
        <span class="mono">min</span>
      </div>
    </div>
  </main>

  <footer>
